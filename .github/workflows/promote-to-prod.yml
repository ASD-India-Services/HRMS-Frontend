name: Promote develop -> main (production)

# One-click production promotion. Run manually from the Actions tab.
# It fast-forwards/merges `develop` into `main`, but ONLY after a human
# approves the `production` environment gate. Merging to `main` then triggers
# the existing ci-cd.yml deploy-to-prod job.
#
# Place this file at: .github/workflows/promote-to-prod.yml  in each repo.
#
# Requires (configured once in repo Settings — see RUNBOOK):
#   - An Environment named `production` with "Required reviewers" set.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "promote" to confirm releasing develop to production'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  approve:
    name: Await production approval
    runs-on: ubuntu-latest
    environment: production      # <- pauses here until a required reviewer approves
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "promote" ]; then
            echo "Confirmation text did not match 'promote'. Aborting."
            exit 1
          fi
          echo "Confirmed. Proceeding with promotion."

  promote:
    name: Merge develop into main
    runs-on: ubuntu-latest
    needs: approve
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge develop into main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main develop
          git checkout main
          # Merge the reviewed develop into main; the push triggers prod deploy.
          git merge --no-ff origin/develop -m "Promote develop to production"
          git push origin main
