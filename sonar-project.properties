# SonarCloud — update organization/projectKey to match what SonarCloud assigns
# when you import the repo (Settings shows the exact keys).
sonar.organization=asd-india-services
sonar.projectKey=asd-india-services_hrms-frontend
sonar.projectName=HRMS Frontend
sonar.projectVersion=1.0

sonar.sources=src
sonar.sourceEncoding=UTF-8

# TypeScript config for accurate JS/TS analysis
sonar.typescript.tsconfigPaths=tsconfig.json

# Coverage (lcov) — enable once a test runner emitting coverage is added
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  public/**,\
  **/*.config.ts,\
  **/*.config.js,\
  **/vite-env.d.ts
